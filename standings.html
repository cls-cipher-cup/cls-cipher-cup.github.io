<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05070d" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <link rel="icon" type="image/png" href="./img/icon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="./img/icon/favicon.svg" />
  <link rel="shortcut icon" href="./img/icon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="./img/icon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Cipher Cup" />
  <link rel="manifest" href="./img/icon/site.webmanifest" />
  <meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#05070d">
  <title>CLS Cipher Cup · 排行榜</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070d;
      --text: #edf4ff;
      --muted: #8c9bb2;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans HK",
                   "PingFang HK", "Microsoft JhengHei", sans-serif;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    body { min-height: 100vh; overflow-x: hidden; }

    .site-nav {
      position: fixed; z-index: 20; top: 16px; left: 50%;
      width: min(1120px, calc(100% - 32px));
      transform: translateX(-50%);
      display: flex; align-items: center; justify-content: space-between;
      gap: 20px; padding: 11px 14px 11px 20px;
      border: 1px solid rgba(210,229,255,.13); border-radius: 999px;
      background: rgba(8,12,21,.66);
      box-shadow: 0 12px 42px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.05);
      -webkit-backdrop-filter: blur(24px) saturate(145%);
      backdrop-filter: blur(24px) saturate(145%);
    }
    .nav-brand {
      display: flex; align-items: center;
      width: 150px; height: 32px;
      text-decoration: none;
    }
    .nav-brand img {
      display: block; height: 100%;
      object-fit: contain; object-position: left center;
    }
    .nav-links {
      display: flex; align-items: center;
      gap: clamp(12px, 2.8vw, 30px);
    }
    .nav-links a {
      color: #aab8cd; text-decoration: none;
      font-size: 13px; white-space: nowrap;
      transition: color .2s ease;
    }
    .nav-links a:hover { color: #f4f8ff; }

    main {
      width: min(980px, calc(100% - 32px));
      margin: 96px auto 80px;
    }
    .page-head { padding: 30px 0 22px; }
    .kicker {
      margin: 0 0 12px;
      color: #78b7f7; font-size: 11px;
      letter-spacing: .22em; text-transform: uppercase;
      font-weight: 650;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 4vw, 46px);
      font-weight: 600; letter-spacing: -.04em;
    }
    .sub {
      margin: 0;
      color: var(--muted); font-size: 14px; line-height: 1.7;
    }
    .sub .updated {
      color: #cfe2fb;
      font-variant-numeric: tabular-nums;
    }

    .standings-panel {
      margin-top: 24px;
      padding: clamp(20px, 4vw, 30px);
      border: 1px solid rgba(160,196,238,.15);
      border-radius: 22px;
      background:
        linear-gradient(135deg, rgba(20,35,56,.52), rgba(9,14,24,.68)),
        rgba(10,15,25,.75);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 18px 60px rgba(0,0,0,.12);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .tabs {
      display: inline-flex;
      padding: 4px;
      border: 1px solid rgba(160,196,238,.15);
      border-radius: 999px;
      background: rgba(3,7,14,.5);
      gap: 2px;
    }
    .tab-btn {
      border: 0;
      padding: 9px 18px;
      border-radius: 999px;
      background: transparent;
      color: #aab8cd;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s ease, color .2s ease;
    }
    .tab-btn:hover { color: #f4f8ff; }
    .tab-btn.active {
      background: linear-gradient(135deg, #397fc3, #5aa9ff);
      color: #fff;
      box-shadow: 0 4px 14px rgba(58,148,255,.3);
    }

    .year-select {
      padding: 9px 14px;
      border: 1px solid rgba(160,196,238,.18);
      border-radius: 10px;
      background: rgba(3,7,14,.55);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }
    .year-select:focus {
      border-color: rgba(125,190,255,.56);
      box-shadow: 0 0 0 3px rgba(75,151,232,.08);
    }

    .image-wrap {
      border-radius: 14px;
      background: rgba(3,7,14,.35);
      border: 1px solid rgba(160,196,238,.1);
      padding: 12px;
      min-height: 200px;
      display: grid;
      place-items: center;
    }
    .image-wrap img {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .empty {
      padding: 40px 20px;
      color: #8594aa;
      font-size: 14px;
      text-align: center;
      line-height: 1.8;
    }

    @media (max-width: 620px) {
      .site-nav { top: 9px; width: calc(100% - 18px); padding: 9px 12px; }
      .nav-brand { width: 110px; }
      .nav-links { gap: 12px; }
      .nav-links a { font-size: 11px; }
      main { margin-top: 78px; }
      .tab-btn { padding: 8px 14px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="主導航">
    <a class="nav-brand" href="./index.html" aria-label="返回首頁">
      <img src="./img/logo/Cipher Cup Horizontal.png" alt="CLS Cipher Cup" />
    </a>
    <div class="nav-links">
      <a href="./index.html">返回主頁</a>
    </div>
  </nav>

  <main>
    <header class="page-head">
      <p class="kicker">STANDINGS</p>
      <h1>排行榜</h1>
      <p class="sub">不定期更新，最後更新：<span class="updated" id="updatedAt">—</span></p>
    </header>

    <section class="standings-panel">
      <div class="toolbar">
        <div class="tabs" role="tablist">
          <button class="tab-btn active" data-tab="monthly" type="button">月度排名</button>
          <button class="tab-btn" data-tab="yearly" type="button">全年排名</button>
        </div>
        <select class="year-select" id="yearSelect" aria-label="學年"></select>
      </div>

      <div class="image-wrap" id="imageWrap">
        <div class="empty">載入中…</div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const $ = id => document.getElementById(id);
      const yearSelect = $("yearSelect");
      const imageWrap = $("imageWrap");
      const updatedAtEl = $("updatedAt");
      const tabBtns = [...document.querySelectorAll(".tab-btn")];

      let allContests = [];
      let allYears = [];
      let currentYear = "";
      let currentTab = "monthly";

      function inferAcademicYear(year, month) {
        const y1 = month >= 9 ? year : year - 1;
        return `${String(y1).slice(-2)}-${String(y1 + 1).slice(-2)}`;
      }

      function pad(n) { return String(n).padStart(2, "0"); }
      function formatHKT(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return "—";
        const HKT_OFFSET = 8 * 60 * 60 * 1000;
        const x = new Date(d.getTime() + HKT_OFFSET);
        return `${x.getUTCFullYear()}/${pad(x.getUTCMonth() + 1)}/${pad(x.getUTCDate())} ${pad(x.getUTCHours())}:${pad(x.getUTCMinutes())}`;
      }

      async function loadContests() {
        try {
          const res = await fetch("./data/contests.json", { cache: "no-store" });
          if (!res.ok) throw new Error("missing");
          const data = await res.json();
          allContests = Array.isArray(data.contests) ? data.contests : [];
          allYears = [...new Set(
            allContests.map(c => c.schoolYear).filter(Boolean)
          )].sort();
        } catch {
          allContests = [];
          allYears = [];
        }
      }

      function populateYearSelect() {
        const now = new Date();
        const currentSY = inferAcademicYear(now.getFullYear(), now.getMonth() + 1);

        let list = [...allYears];
        if (!list.includes(currentSY)) list.push(currentSY);
        list.sort();

        yearSelect.innerHTML = list.map(sy =>
          `<option value="${sy}">學年 ${sy}</option>`
        ).join("");

        currentYear = list.includes(currentSY) ? currentSY : list[list.length - 1];
        yearSelect.value = currentYear;

        if (list.length <= 1) {
          yearSelect.style.display = "none";
        }
      }

      async function loadStandings() {
        imageWrap.innerHTML = `<div class="empty">載入中…</div>`;
        updatedAtEl.textContent = "—";

        if (!currentYear) {
          imageWrap.innerHTML = `<div class="empty">尚無排行榜資料。</div>`;
          return;
        }

        let data = null;
        try {
          const res = await fetch(`./${currentYear}/standings.json`, { cache: "no-store" });
          if (res.ok) data = await res.json();
        } catch {}

        const entry = data?.[currentTab] || null;

        if (!entry || !entry.imageUrl) {
          imageWrap.innerHTML = `<div class="empty">本月排行榜尚未公布。<br>請稍後再來查看。</div>`;
          return;
        }

        updatedAtEl.textContent = formatHKT(entry.updatedAt);
        imageWrap.innerHTML = `<img src="${entry.imageUrl}" alt="${currentTab === 'monthly' ? '月度排名' : '全年排名'}" loading="lazy" />`;
      }

      function setTab(tab) {
        currentTab = tab;
        tabBtns.forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        loadStandings();
      }

      tabBtns.forEach(btn => {
        btn.addEventListener("click", () => setTab(btn.dataset.tab));
      });

      yearSelect.addEventListener("change", () => {
        currentYear = yearSelect.value;
        loadStandings();
      });

      (async () => {
        await loadContests();
        populateYearSelect();
        await loadStandings();
      })();
    })();
  </script>
</body>
</html>
