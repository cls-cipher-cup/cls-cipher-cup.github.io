   <p class="muted">索引寫入 <code>data/contests.json</code>，各關卡完整資料寫入 <code>./{學年}/{月份縮寫}/lv1.json</code> 等。</p>
   <p class="status" id="editorStatus" role="status"></p>

<script>
(() => {
 const $=s=>document.querySelector(s);
 const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
 const monthShortNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

 let token='', repo='', branch='main', fileSha=null, editingKey=null;

 let contestsData = { schemaVersion: 2, updatedAt: null, schoolYears: [], contests: [] };

 /* ============================================================
    Cookie + localStorage 雙寫
 ============================================================ */
 const COOKIE_MAX_AGE = 8 * 60 * 60;
 function setCookie(name, value, maxAgeSec = COOKIE_MAX_AGE) {
   const parts = [
     `${encodeURIComponent(name)}=${encodeURIComponent(value)}`,
     'path=/', 'SameSite=Lax'
   ];
   if (maxAgeSec) parts.push(`max-age=${maxAgeSec}`);
   if (location.protocol === 'https:') parts.push('Secure');
   document.cookie = parts.join('; ');
 }
 function getCookie(name) {
   const key = encodeURIComponent(name) + '=';
   return document.cookie.split('; ').reduce((acc, c) =>
     c.indexOf(key) === 0 ? decodeURIComponent(c.slice(key.length)) : acc, '');
 }
 function delCookie(name) {
   document.cookie = `${encodeURIComponent(name)}=; path=/; max-age=0; SameSite=Lax`;
 }
 function storeSet(key, val) {
   try { localStorage.setItem(key, val); } catch {}
   try { setCookie(key, val); } catch {}
 }
 function storeGet(key) {
   let v = '';
   try { v = localStorage.getItem(key) || ''; } catch {}
   if (!v) { try { v = getCookie(key); } catch {} }
   return v;
 }
 function storeDel(key) {
   try { localStorage.removeItem(key); } catch {}
   try { delCookie(key); } catch {}
 }

 /* ============================================================
    背景
 ============================================================ */
 const canvas=$('#mesh'), ctx=canvas.getContext('2d',{alpha:true});
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const spacing=62;
 const rand=(a,b)=>a+Math.random()*(b-a);
 let w=0,h=0,dpr=1,points=[],edges=[],glows=[],rafId=0,lastFrame=0;
 const SWEEP_PERIOD=10000;
 const SWEEP_DURATION=6500;

 function warpPoint(x,y){
   const cx=w/2,cy=h/2;
   const dx=x-cx,dy=y-cy;
   const nx=dx/Math.max(cx,1),ny=dy/Math.max(cy,1);
   const r2=nx*nx+ny*ny;
   const strength=0.052;
   const f=1-strength*r2;
   return {x:cx+dx*f,y:cy+dy*f};
 }
 function buildMesh(){
   const cols=Math.ceil(w/spacing)+3;
   const rows=Math.ceil(h/spacing)+3;
   points=[];edges=[];glows=[];
   for(let row=-1;row<rows;row++){
     points[row+1]=[];
     for(let col=-1;col<cols;col++){
       const baseX=col*spacing+((row&1)?spacing/2:0);
       const baseY=row*spacing*0.866;
       const jx=rand(-3.5,3.5), jy=rand(-3.5,3.5);
       const p=warpPoint(baseX+jx,baseY+jy);
       points[row+1][col+1]={x:p.x,y:p.y};
     }
   }
   for(let r=0;r<points.length-1;r++){
     for(let c=0;c<points[r].length-1;c++){
       const a=points[r][c],b=points[r][c+1],d=points[r+1][c],e=points[r+1][c+1];
       if(!a||!b||!d||!e)continue;
       pushEdge(a,b);pushEdge(a,d);pushEdge(b,d);pushEdge(b,e);pushEdge(d,e);
     }
   }
   const glowCount=Math.min(260,Math.max(30,Math.round((w*h)/16000)));
   for(let i=0;i<glowCount;i++){
     const period=rand(3600,12000);
     glows.push({
       edge:edges[Math.floor(Math.random()*edges.length)],
       start:rand(0,period),
       period,
       duration:period*rand(0.30,0.52),
       strength:rand(0.40,0.92)
     });
   }
 }
 function pushEdge(a,b){edges.push({a,b,mx:(a.x+b.x)*0.5,my:(a.y+b.y)*0.5})}
 function drawEdgeGlow(edge,alpha){
   ctx.beginPath();
   ctx.moveTo(edge.a.x,edge.a.y);
   ctx.lineTo(edge.b.x,edge.b.y);
   ctx.strokeStyle=`rgba(126,202,255,${Math.min(0.95,alpha)})`;
   ctx.lineWidth=1+alpha*1.6;
   ctx.shadowColor=`rgba(58,148,255,${Math.min(1,alpha*0.9)})`;
   ctx.shadowBlur=9+alpha*15;
   ctx.stroke();
 }
 function drawSweep(time){
   const t=time%SWEEP_PERIOD;
   if(t>SWEEP_DURATION)return;
   const p=t/SWEEP_DURATION;
   const envelope=Math.sin(p*Math.PI);
   if(envelope<0.03)return;
   const sweepX=(-0.18+p*1.36)*w;
   const sigma=Math.max(75,w*0.085);
   const inv=1/(2*sigma*sigma);
   const reach=sigma*3;
   ctx.save();
   ctx.lineCap='round';
   for(const edge of edges){
     const dx=edge.mx-sweepX;
     if(dx>reach||dx<-reach)continue;
     const g=Math.exp(-dx*dx*inv)*envelope;
     if(g<0.05)continue;
     ctx.beginPath();
     ctx.moveTo(edge.a.x,edge.a.y);
     ctx.lineTo(edge.b.x,edge.b.y);
     ctx.strokeStyle=`rgba(150,210,255,${Math.min(0.30,g*0.30)})`;
     ctx.lineWidth=0.8+g*1.0;
     ctx.stroke();
   }
   ctx.restore();
 }
 function drawMesh(time){
   ctx.clearRect(0,0,w,h);
   ctx.lineWidth=0.72;
   ctx.strokeStyle='rgba(105,151,207,0.105)';
   ctx.beginPath();
   for(const edge of edges){
     ctx.moveTo(edge.a.x,edge.a.y);
     ctx.lineTo(edge.b.x,edge.b.y);
   }
   ctx.stroke();
   if(reduced)return;
   drawSweep(time);
   ctx.save();
   for(const g of glows){
     const t=(time+g.start)%g.period;
     if(t>g.duration)continue;
     const p=t/g.duration;
     const alpha=Math.pow(Math.sin(p*Math.PI),1.25)*g.strength;
     if(alpha<0.04)continue;
     drawEdgeGlow(g.edge,alpha);
   }
   ctx.restore();
 }
 function resizeCanvas(){
   w=innerWidth;h=innerHeight;
   dpr=Math.min(devicePixelRatio||1,1.6);
   canvas.width=Math.round(w*dpr);
   canvas.height=Math.round(h*dpr);
   canvas.style.width=w+'px';
   canvas.style.height=h+'px';
   ctx.setTransform(dpr,0,0,dpr,0,0);
   buildMesh();
   drawMesh(performance.now());
 }
 function animate(time){
   if(time-lastFrame>=33){drawMesh(time);lastFrame=time}
   rafId=requestAnimationFrame(animate);
 }
 resizeCanvas();
 if(!reduced)rafId=requestAnimationFrame(animate);
 let resizeTimer=0;
 addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resizeCanvas,100)},{passive:true});

 /* ============================================================
    工具函數
 ============================================================ */
 function setStatus(id,msg,good=false){$(id).style.color=good?'#9decc8':'#ffbd9d';$(id).textContent=msg}
 function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

 function utf8ToB64(str){return btoa(unescape(encodeURIComponent(str)))}
 function b64ToUtf8(b64){return decodeURIComponent(escape(atob(b64.replace(/\n/g,''))))}

 /* ============================================================
    內部驗證（PBKDF2 慢哈希；每關隨機 salt）
    sig = base64( salt(16) || pbkdf2_hash(32) )
 ============================================================ */
 const CYCLES = 300000;
 const SALT_LEN = 16;
 const KEY_LEN = 32;

 function bytesToB64(bytes){
   return btoa(String.fromCharCode(...new Uint8Array(bytes)));
 }
 function b64ToBytes(b64){
   return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
 }

 async function deriveKey(answer, salt){
   const keyMaterial = await crypto.subtle.importKey(
     'raw',
     new TextEncoder().encode(answer),
     'PBKDF2',
     false,
     ['deriveBits']
   );
   const bits = await crypto.subtle.deriveBits(
     { name:'PBKDF2', salt, iterations: CYCLES, hash:'SHA-256' },
     keyMaterial,
     KEY_LEN * 8
   );
   return new Uint8Array(bits);
 }

 async function makeSig(answer){
   const salt = crypto.getRandomValues(new Uint8Array(SALT_LEN));
   const hash = await deriveKey(answer, salt);
   const combined = new Uint8Array(SALT_LEN + KEY_LEN);
   combined.set(salt, 0);
   combined.set(hash, SALT_LEN);
   return bytesToB64(combined);
 }

 // 依「月份在 9 月以上」判斷學年
 function inferSchoolYear(year, month){
   const m=Number(month);
   const y1 = m>=9 ? year : year-1;
   const y2 = y1+1;
   return `${String(y1).slice(-2)}-${String(y2).slice(-2)}`;
 }

 function keyOf(c){
   return `${c.schoolYear||'_'}-${c.year}-${String(c.month).padStart(2,'0')}`;
 }

 /* ============================================================
    截止時間自動填入（香港時間，當月最後一日 23:59）
 ============================================================ */
 function computeEndAt(year, month){
   const y = Number(year);
   const m = Number(month);
   if (!y || !m) return '';
   const lastDay = new Date(Date.UTC(y, m, 0)).getUTCDate();
   return `${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}T23:59:00+08:00`;
 }
 function updateEndAt(){
   const y = Number($('#year').value);
   const m = Number($('#month').value);
   if (!y || y < 2000 || y > 2100) return;
   if (!m || m < 1 || m > 12) return;
   $('#endAt').value = computeEndAt(y, m);
 }

 /* ============================================================
    GitHub API
 ============================================================ */
 async function api(path,opts={}){
   const r=await fetch(`https://api.github.com${path}`,{
     ...opts,
     headers:{
       'Accept':'application/vnd.github+json',
       'Authorization':`Bearer ${token}`,
       'X-GitHub-Api-Version':'2022-11-28',
       ...(opts.headers||{})
     }
   });
   let data={};
   try{data=await r.json()}catch{}
   if(!r.ok)throw new Error(data.message||`GitHub API error ${r.status}`);
   return data;
 }

 function repoPath(rel){
   return `/repos/${repo.split('/').map(encodeURIComponent).join('/')}/contents/${rel.replace(/^\/+/,'').replace(/^\.\//,'')}`;
 }

 async function readFile(rel){
   try{
     const f=await api(repoPath(rel));
     return { sha:f.sha, text:b64ToUtf8(f.content) };
   }catch(e){
     if(String(e.message).includes('Not Found'))return null;
     throw e;
   }
 }

 async function writeFile(rel, content, message){
   const cleanPath = rel.replace(/^\/+/,'').replace(/^\.\//,'');
   const url = repoPath(cleanPath);
   let sha = null;
   try{
     const existing = await api(url);
     sha = existing.sha;
   }catch(e){
     if(!String(e.message).includes('Not Found'))throw e;
   }
   const encoded = utf8ToB64(typeof content==='string'?content:JSON.stringify(content,null,2));
   const body = {
     message: message || `Update ${cleanPath}`,
     content: encoded,
     branch
   };
   if(sha) body.sha = sha;
   const result = await api(url,{
     method:'PUT',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify(body)
   });
   return result;
 }

 /* ============================================================
    賽事索引
 ============================================================ */
 function ensureCurrentSchoolYear(){
   const n=new Date();
   const sy=inferSchoolYear(n.getFullYear(), n.getMonth()+1);
   if(!contestsData.schoolYears.includes(sy)){
     contestsData.schoolYears.push(sy);
     contestsData.schoolYears.sort();
   }
 }

 function normalizeIndex(raw){
   if(!raw || typeof raw!=='object')return { schemaVersion:2, updatedAt:null, schoolYears:[], contests:[] };
   if(raw.schemaVersion===2 && Array.isArray(raw.schoolYears)){
     // 仍要清除 levels 裡不應該存在的欄位
     const out = JSON.parse(JSON.stringify(raw));
     out.contests = (out.contests||[]).map(c=>({
       ...c,
       levels: (c.levels||[]).map(l=>({
         ciphertext: l.ciphertext||'',
         hint: l.hint||'',
         mediaUrl: l.mediaUrl||'',
         sig: l.sig||''
       }))
     }));
     return out;
   }
   // 舊版 schema v1
   const out = { schemaVersion:2, updatedAt:raw.updatedAt||null, schoolYears:[], contests:[] };
   for(const c of (raw.contests||[])){
     const sy = inferSchoolYear(Number(c.year), Number(c.month));
     if(!out.schoolYears.includes(sy)) out.schoolYears.push(sy);
     out.contests.push({
       schoolYear: sy,
       year: c.year, month: c.month, monthName: c.monthName,
       theme: c.theme, endAt: c.endAt, googleFormUrl: c.googleFormUrl,
       published: c.published !== false,
       basePath: `${sy}/${monthShortNames[Number(c.month)-1]}`,
       levels: (c.levels||[]).map(l=>({
         ciphertext: l.ciphertext||'',
         hint: l.hint||'',
         mediaUrl: l.mediaUrl||'',
         sig: l.sig||''
       }))
     });
   }
   out.schoolYears.sort();
   return out;
 }

 async function loadRepoData(){
   const f = await readFile('data/contests.json');
   if(f){
     fileSha = f.sha;
     try{
       contestsData = normalizeIndex(JSON.parse(f.text));
     }catch{
       contestsData = { schemaVersion:2, updatedAt:null, schoolYears:[], contests:[] };
     }
   }else{
     fileSha = null;
     contestsData = { schemaVersion:2, updatedAt:null, schoolYears:[], contests:[] };
   }
   ensureCurrentSchoolYear();
   renderSchoolYearOptions();
   renderContestList();
   updateCurrent();
 }

 async function writeIndex(){
   contestsData.updatedAt = new Date().toISOString();
   const url = repoPath('data/contests.json');
   const content = utf8ToB64(JSON.stringify(contestsData,null,2));
   const body = {
     message:'Update CLS Cipher Cup contest index',
     content,
     branch
   };
   if(fileSha) body.sha = fileSha;
   const result = await api(url,{
     method:'PUT',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify(body)
   });
   fileSha = result.content?.sha || fileSha;
 }

 /* ============================================================
    學年下拉選單
 ============================================================ */
 function renderSchoolYearOptions(preferValue){
   const sel = $('#schoolYear');
   const cur = preferValue || sel.value;
   sel.innerHTML = contestsData.schoolYears
     .map(sy=>`<option value="${escapeHtml(sy)}">${escapeHtml(sy)}</option>`)
     .join('');
   if(cur && contestsData.schoolYears.includes(cur)){
     sel.value = cur;
   }else if(contestsData.schoolYears.length){
     sel.value = contestsData.schoolYears[contestsData.schoolYears.length-1];
   }
   updatePathHint();
 }

 function updatePathHint(){
   const sy = $('#schoolYear').value || '{學年}';
   const m  = Number($('#month').value) || 1;
   const ms = monthShortNames[m-1] || '{月份}';
   $('#pathHint').textContent = `資料將儲存於 ./${sy}/${ms}/lv1.json … lv3.json`;
 }

 async function addSchoolYear(){
   const input = prompt('請輸入新的學年標籤（格式 YY-YY，例如 26-27）：', '');
   if(input===null)return;
   const label = input.trim();
   if(!/^\d{2}-\d{2}$/.test(label)){
     setStatus('#editorStatus','格式錯誤，請使用 YY-YY 格式，例如 26-27。');
     return;
   }
   if(contestsData.schoolYears.includes(label)){
     setStatus('#editorStatus',`學年 ${label} 已存在。`);
     return;
   }
   contestsData.schoolYears.push(label);
   contestsData.schoolYears.sort();
   try{
     await writeFile(`${label}/.gitkeep`, `# School year ${label}\n`, `Create school year folder ${label}`);
     await writeIndex();
     renderSchoolYearOptions(label);
     setStatus('#editorStatus',`已新增學年 ${label}，並建立 ./${label}/ 資料夾。`,true);
   }catch(e){
     contestsData.schoolYears = contestsData.schoolYears.filter(sy=>sy!==label);
     setStatus('#editorStatus',`新增失敗：${e.message}`);
   }
 }

 async function removeSchoolYear(){
   const sel = $('#schoolYear');
   const label = sel.value;
   if(!label)return;
   const affected = contestsData.contests.filter(c=>c.schoolYear===label);
   const msg = affected.length
     ? `學年 ${label} 下有 ${affected.length} 個賽事。刪除後這些賽事也會從索引移除（GitHub 上的資料檔案不會自動刪除）。\n\n確定要刪除嗎？`
     : `確定要刪除學年 ${label}？`;
   if(!confirm(msg))return;

   const backupYears = [...contestsData.schoolYears];
   const backupContests = [...contestsData.contests];
   contestsData.schoolYears = contestsData.schoolYears.filter(sy=>sy!==label);
   contestsData.contests = contestsData.contests.filter(c=>c.schoolYear!==label);

   try{
     await writeIndex();
     renderSchoolYearOptions();
     renderContestList();
     setStatus('#editorStatus',`已刪除學年 ${label}（GitHub 上的檔案未刪除）。`,true);
   }catch(e){
     contestsData.schoolYears = backupYears;
     contestsData.contests = backupContests;
     setStatus('#editorStatus',`刪除失敗：${e.message}`);
   }
 }

 /* ============================================================
    關卡編輯
 ============================================================ */
 function renderLevels(levels=[{},{},{}]){
  $('#levels').innerHTML=levels.map((l,i)=>`<div class="level"><h3>關卡 ${['一','二','三'][i]}</h3><div class="field"><label>答案（驗證用）</label><textarea data-field="plaintext" data-level="${i}" placeholder="輸入正確答案">${escapeHtml(l.plaintext||'')}</textarea></div><div class="field"><label>顯示密文</label><textarea data-field="ciphertext" data-level="${i}" placeholder="輸入密文">${escapeHtml(l.ciphertext||'')}</textarea></div><div class="field"><label>提示</label><textarea data-field="hint" data-level="${i}" placeholder="可留空">${escapeHtml(l.hint||'')}</textarea></div><div class="field"><label>圖片／影片／音訊網址（可留空）</label><input data-field="mediaUrl" data-level="${i}" type="url" placeholder="https://…" value="${escapeHtml(l.mediaUrl||'')}"></div></div>`).join('');
 }
 function getLevels(){return [0,1,2].map(i=>{const o={};document.querySelectorAll(`[data-level="${i}"]`).forEach(el=>o[el.dataset.field]=el.value.trim());return o})}

 /* ============================================================
    登入流程
 ============================================================ */
 async function verifyAndEnter(loginHint){
   const user=await api('/user');
   const [owner,name]=repo.split('/');
   const info=await api(`/repos/${encodeURIComponent(owner)}/${encodeURIComponent(name)}`);
   if(!info.permissions?.push)throw new Error('此 Token 沒有該儲存庫的寫入權限。請確認 Fine-grained PAT 的 Contents: Read and write。');
   branch=info.default_branch||'main';
   $('#repoLabel').textContent=repo;
   $('#welcomeSub').textContent=`已驗證 GitHub 帳戶：${user.login}。`;
   $('#loginPanel').classList.add('hidden');
   $('#dashboard').classList.remove('hidden');
   await loadRepoData();
   setStatus('#globalStatus',loginHint,true);
 }

 async function login(){
  token=$('#ghToken').value.trim();repo=$('#ghRepo').value.trim();
  if(!token||!/^[^/\s]+\/[^/\s]+$/.test(repo)){setStatus('#loginStatus','請輸入 Token 及正確的 owner/repo。');return}
  $('#loginBtn').disabled=true;setStatus('#loginStatus','正在驗證 GitHub 帳戶及儲存庫權限…');
  try{
   await verifyAndEnter('已登入。Token 儲存於 cookie （8 小時有效）；登出後會清除。');
   storeSet('ccc_admin_session','1');
   storeSet('ccc_admin_repo',repo);
   storeSet('ccc_admin_token',token);
  }catch(e){
   token='';
   clearAdminSession();
   setStatus('#loginStatus',`登入失敗：${e.message}`);
  }finally{$('#loginBtn').disabled=false}
 }

 async function autoLogin(){
  const savedToken=storeGet('ccc_admin_token');
  const savedRepo=storeGet('ccc_admin_repo');
  if(!savedToken||!savedRepo)return;

  token=savedToken;repo=savedRepo;
  $('#ghToken').value=savedToken;
  $('#ghRepo').value=savedRepo;
  $('#loginBtn').disabled=true;
  setStatus('#loginStatus','偵測到先前的登入，正在自動驗證…');

  try{
    await verifyAndEnter('已自動登入（沿用先前的 session）。');
    setStatus('#loginStatus','');
  }catch(e){
    token='';repo='';
    clearAdminSession();
    $('#ghToken').value='';$('#ghRepo').value='';
    setStatus('#loginStatus',`自動登入失敗：${e.message}。請重新輸入 Token。`);
  }finally{
    $('#loginBtn').disabled=false;
  }
 }

 function clearAdminSession(){
  storeDel('ccc_admin_session');
  storeDel('ccc_admin_repo');
  storeDel('ccc_admin_token');
 }

 /* ============================================================
    賽事列表
 ============================================================ */
 function renderContestList(){
  const list=$('#contestList');
  const sorted=[...contestsData.contests].sort((a,b)=>
    (b.year-a.year) || (b.month-a.month)
  );
  list.innerHTML = sorted.length
    ? sorted.map(c=>`
      <div class="contest-item">
        <div>
          <strong>${escapeHtml(c.year)} / ${escapeHtml(c.monthName||monthNames[c.month-1])} · ${escapeHtml(c.theme||'未命名主題')}</strong>
          <span class="badge">${c.published===false?'已封存':'已發布'} · 學年 ${escapeHtml(c.schoolYear||'?')} · ${c.levels?.length||0} 關 · <code>./${escapeHtml(c.basePath||'')}/</code></span>
        </div>
        <div class="actions">
          <button class="btn secondary" data-edit="${escapeHtml(keyOf(c))}">編輯</button>
          <button class="btn danger" data-archive="${escapeHtml(keyOf(c))}">${c.published===false?'重新發布':'封存'}</button>
        </div>
      </div>`).join('')
    : '<p class="muted">目前尚未有賽事。請在下方建立第一個月份。</p>';
  list.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>editContest(b.dataset.edit)));
  list.querySelectorAll('[data-archive]').forEach(b=>b.addEventListener('click',()=>toggleArchive(b.dataset.archive)));
 }

 function updateCurrent(){
   const n=new Date();
   $('#currentMonth').textContent=`${monthNames[n.getMonth()]} ${n.getFullYear()}`;
   const end=new Date(n.getFullYear(),n.getMonth()+1,1);
   $('#countdown').textContent=`距離本月結束約 ${Math.max(0,Math.ceil((end-n)/86400000))} 日`;
   $('#year').value=n.getFullYear();
   $('#month').value=String(n.getMonth()+1);
   const sy = inferSchoolYear(n.getFullYear(), n.getMonth()+1);
   if(contestsData.schoolYears.includes(sy)){
     $('#schoolYear').value = sy;
   }
   updatePathHint();
   updateEndAt();
 }

 /* ============================================================
    編輯 / 新增 / 儲存
 ============================================================ */
 function editContest(k){
   const c=contestsData.contests.find(x=>keyOf(x)===k);
   if(!c)return;
   editingKey=k;
   $('#editorTitle').textContent=`編輯賽事：${c.year} / ${c.monthName}`;
   $('#year').value=c.year;
   $('#month').value=c.month;
   if(c.schoolYear && contestsData.schoolYears.includes(c.schoolYear)){
     $('#schoolYear').value = c.schoolYear;
   }
   $('#theme').value=c.theme||'';
   if(c.endAt){
     $('#endAt').value=c.endAt;
   }else{
     updateEndAt();
   }
   $('#googleFormUrl').value=c.googleFormUrl||'';
   // 答案欄不預填（無法從 sig 還原），需重新輸入
   const levels = (c.levels||[{},{},{}]).map(l=>({
     plaintext:'',
     ciphertext:l.ciphertext||'',
     hint:l.hint||'',
     mediaUrl:l.mediaUrl||''
   }));
   renderLevels(levels);
   updatePathHint();
   $('#editorPanel').scrollIntoView({behavior:'smooth'});
   setStatus('#editorStatus','已載入現有資料。為保障安全，答案需重新輸入，重新發布會重新計算。',true);
 }

 function clearEditor(){
   editingKey=null;
   $('#editorTitle').textContent='提交新的賽事題目';
   $('#theme').value='';
   $('#googleFormUrl').value='';
   renderLevels();
   updateCurrent();
   setStatus('#editorStatus','');
 }

 async function saveContest(){
   const year=Number($('#year').value);
   const month=Number($('#month').value);
   const schoolYear=$('#schoolYear').value;
   const theme=$('#theme').value.trim();
   const levels=getLevels();

   if(!year||!month||!theme){setStatus('#editorStatus','請填寫年份、月份及主題。');return}
   if(!schoolYear){setStatus('#editorStatus','請選擇學年（可先按 ＋ 新增）。');return}
   if(levels.some(l=>!l.plaintext||!l.ciphertext)){
     setStatus('#editorStatus','三個關卡均須填寫答案及顯示密文。');
     return;
   }

   const monthShort = monthShortNames[month-1];
   const basePath = `${schoolYear}/${monthShort}`;

   const previous = contestsData.contests.find(c =>
     c.schoolYear === schoolYear && c.year === year && c.month === month
   );
   if(!editingKey && previous){
     setStatus('#editorStatus','該學年此月份已存在賽事，請按「編輯」修改。');
     return;
   }

   $('#saveBtn').disabled=true;
   setStatus('#editorStatus','正在計算驗證資料、寫入 GitHub…');

   try{
     const cooked=[];
     for(const l of levels){
       const sig = await makeSig(l.plaintext);
       cooked.push({
         ciphertext: l.ciphertext,
         hint: l.hint||'',
         mediaUrl: l.mediaUrl||'',
         sig
       });
     }

     for(let i=0;i<3;i++){
       await writeFile(
         `${basePath}/lv${i+1}.json`,
         cooked[i],
         `Update ${basePath}/lv${i+1}.json`
       );
     }

     const idxLevels = cooked.map(l=>({
       ciphertext: l.ciphertext,
       hint: l.hint,
       mediaUrl: l.mediaUrl,
       sig: l.sig
     }));

     let endAt = $('#endAt').value.trim();
     if(!endAt) endAt = computeEndAt(year, month);

     const idxEntry = {
       schoolYear,
       year,
       month,
       monthName: monthNames[month-1],
       theme,
       endAt,
       googleFormUrl: $('#googleFormUrl').value.trim(),
       published: true,
       basePath,
       levels: idxLevels
     };

     contestsData.contests = contestsData.contests.filter(c =>
       !(c.year===year && c.month===month)
     );
     contestsData.contests.push(idxEntry);

     if(!contestsData.schoolYears.includes(schoolYear)){
       contestsData.schoolYears.push(schoolYear);
       contestsData.schoolYears.sort();
     }

     await writeIndex();
     renderContestList();
     renderSchoolYearOptions(schoolYear);
     clearEditor();
     setStatus('#globalStatus',`賽事資料已提交（${basePath}/lv1..3.json）。等待 Pages 部署完成。`,true);
   }catch(e){
     setStatus('#editorStatus',`發布失敗：${e.message}`);
   }finally{
     $('#saveBtn').disabled=false;
   }
 }

 async function toggleArchive(k){
   const c=contestsData.contests.find(x=>keyOf(x)===k);
   if(!c)return;
   const before = c.published;
   c.published = c.published===false ? true : false;
   try{
     await writeIndex();
     renderContestList();
     setStatus('#globalStatus',`${c.year} / ${c.monthName} 狀態已更新。`,true);
   }catch(e){
     c.published = before;
     setStatus('#globalStatus',`更新失敗：${e.message}`);
   }
 }

 /* ============================================================
    事件綁定
 ============================================================ */
 $('#loginBtn').addEventListener('click',login);
 $('#ghToken').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
 $('#saveBtn').addEventListener('click',saveContest);
 $('#newBtn').addEventListener('click',clearEditor);
 $('#addYearBtn').addEventListener('click',addSchoolYear);
 $('#removeYearBtn').addEventListener('click',removeSchoolYear);
 $('#month').addEventListener('change',()=>{updatePathHint();updateEndAt();});
 $('#year').addEventListener('input',()=>{updateEndAt();});
 $('#year').addEventListener('change',()=>{updateEndAt();});
 $('#schoolYear').addEventListener('change',updatePathHint);
 $('#logoutBtn').addEventListener('click',()=>{
   token='';repo='';
   clearAdminSession();
   location.href='./index.html';
 });

 renderLevels();
 updateCurrent();
 autoLogin();
})();
</script>
</body></html>
